name: Copy GreenSprout source snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout test repository
        uses: actions/checkout@v4

      - name: Copy source repository
        shell: bash
        run: |
          set -euo pipefail

          # Clean the test repository working tree first.
          # Keep only the target repository's .git directory.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          # Clone outside the working tree so the cleanup above cannot remove it.
          git clone --depth 1 --branch main https://github.com/aichuangye01163com/greensprout-connect.git /tmp/greensprout-source

          # Copy the source snapshot, excluding Git metadata and secrets.
          tar --exclude='.git' --exclude='.env' -cf - -C /tmp/greensprout-source . | tar -xf - -C .

          rm -rf /tmp/greensprout-source

      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/copy-source.yml

      - name: Commit source snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: copy GreenSprout source snapshot" || echo "No changes to commit"
          git push
